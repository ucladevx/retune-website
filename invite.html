<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retune Invite</title>

<meta property="og:title" content="Join me on Retune" />
<meta property="og:description" content="Discover new music and explore what people are listening to around you." />
<meta property="og:image" content="https://raw.githubusercontent.com/ucladevx/retune-website/2025-update/assets/images/retune_icon.png" />
<meta property="og:url" content="https://retuneapp.com/invite.html" />
<meta property="og:type" content="website" />

</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; text-align:center;">
  <div>
    <h1>You're invited to Retune!</h1>
    <p id="message">Redirecting...</p>
  </div>

  <script>
    const inviteCode = window.location.hash.slice(1);
    const message = document.getElementById("message");

    const deepLink = `retune://invite/${inviteCode}`;
    const appStoreURL = "https://testflight.apple.com/join/aM7xzdDP";

    const isIPhone = /iPhone/i.test(navigator.userAgent);

    if (isIPhone) {
      message.textContent = "Opening Retune…";
  
      let fallbackTriggered = true;
  
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          fallbackTriggered = false;
        }
      });
  
      window.location.href = deepLink;
  
      setTimeout(() => {
        if (fallbackTriggered) {
          message.textContent = "Retune not installed. Redirecting to the App Store…";
          window.location.href = appStoreURL;
        }
      }, 1000);
    } else {
      message.textContent = "Download Retune on iOS to join!";
      window.location.href = appStoreURL;
    }
  </script>  
</body>
</html>
