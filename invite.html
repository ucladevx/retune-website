<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retune Invite</title>
<script>
  // Redirect from /invite.html to /invite for cleaner URLs
  const searchParams = new URLSearchParams(window.location.search);
  const code = searchParams.get('code');
  if (code) {
    window.location.replace(`/invite?code=${encodeURIComponent(code)}`);
  } else {
    window.location.replace('/invite');
  }
</script>
</head>
<body>
  <div style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; text-align:center;">
    <p>Redirecting...</p>
  </div>
</body>
</html>
