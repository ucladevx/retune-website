<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found - Retune</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    text-align: center;
    background-color: #0A1716;
    color: white;
    padding: 20px;
  }
  
  .container {
    max-width: 500px;
  }
  
  h1 {
    font-size: 72px;
    font-weight: 700;
    color: #5649ab;
    margin-bottom: 16px;
    line-height: 1;
  }
  
  h2 {
    font-size: 28px;
    font-weight: 600;
    color: white;
    margin-bottom: 16px;
  }
  
  p {
    font-size: 18px;
    color: rgba(255, 255, 255, 0.8);
    margin-bottom: 32px;
    line-height: 1.6;
  }
  
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    color: white;
    background-color: #5649ab;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 14px rgba(86, 73, 171, 0.3);
  }
  
  .btn:hover {
    background-color: #6b5fc7;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(86, 73, 171, 0.4);
  }
  
  .btn:active {
    transform: translateY(0);
  }
  
  @media (max-width: 767px) {
    html, body {
      overflow: hidden;
      height: 100%;
      touch-action: none;
    }
    .container {
      transform: translateY(-60px);
    }
  }
</style>
<script>
  // Don't interfere with .well-known files
  (function() {
    var path = window.location.pathname;
    if (path.indexOf('/.well-known/') === 0) {
      return; // Let GitHub Pages serve the file
    }
    // Everything else is a 404 - show page not found
  })();
</script>
</head>
<body>
  <header id="top-bar" style="position: fixed; top: 0; left: 0; width: 100%; height: 88px; z-index: 50; display: flex; align-items: center; padding: 0 24px; background-color: rgba(15, 31, 30, 0); border-bottom: 1px solid transparent; transition: all 0.3s ease;">
      <a href="/">
          <img src="/assets/images/retune_icon.png" alt="Retune" style="width: 48px; height: 48px; border-radius: 12px; transition: transform 0.3s ease; box-shadow: 0 4px 14px rgba(0,0,0,0.3);" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
      </a>
  </header>
  <script>
      window.addEventListener('scroll', function() {
          var topBar = document.getElementById('top-bar');
          if (window.scrollY > 20) {
              topBar.style.backgroundColor = 'rgba(15, 31, 30, 0.95)';
              topBar.style.backdropFilter = 'blur(10px)';
              topBar.style.WebkitBackdropFilter = 'blur(10px)';
              topBar.style.boxShadow = '0 4px 20px rgba(0,0,0,0.5)';
              topBar.style.borderColor = 'rgba(255, 255, 255, 0.05)';
          } else {
              topBar.style.backgroundColor = 'rgba(15, 31, 30, 0)';
              topBar.style.backdropFilter = 'none';
              topBar.style.WebkitBackdropFilter = 'none';
              topBar.style.boxShadow = '0 4px 20px rgba(0,0,0,0)';
              topBar.style.borderColor = 'transparent';
          }
      });
  </script>
  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="btn">Return to Home</a>
  </div>
</body>
</html>
