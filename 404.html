<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found - Retune</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    text-align: center;
    background-color: #0A1716;
    color: white;
    padding: 20px;
  }
  
  .container {
    max-width: 500px;
  }
  
  h1 {
    font-size: 72px;
    font-weight: 700;
    color: #5649ab;
    margin-bottom: 16px;
    line-height: 1;
  }
  
  h2 {
    font-size: 28px;
    font-weight: 600;
    color: white;
    margin-bottom: 16px;
  }
  
  p {
    font-size: 18px;
    color: rgba(255, 255, 255, 0.8);
    margin-bottom: 32px;
    line-height: 1.6;
  }
  
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    color: white;
    background-color: #5649ab;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 14px rgba(86, 73, 171, 0.3);
  }
  
  .btn:hover {
    background-color: #6b5fc7;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(86, 73, 171, 0.4);
  }
  
  .btn:active {
    transform: translateY(0);
  }
</style>
<script>
  // Don't interfere with .well-known files
  (function() {
    var path = window.location.pathname;
    if (path.indexOf('/.well-known/') === 0) {
      return; // Let GitHub Pages serve the file
    }
    // Everything else is a 404 - show page not found
  })();
</script>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="btn">Return to Home</a>
  </div>
</body>
</html>
