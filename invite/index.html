<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retune Invite</title>

<meta property="og:title" content="Join me on Retune" />
<meta property="og:description" content="Discover new music and explore what people are listening to around you." />
<meta property="og:image" content="https://raw.githubusercontent.com/ucladevx/retune-website/2025-update/assets/images/retune_icon.png" />
<meta property="og:url" content="https://retuneapp.com/invite" id="og-url" />
<meta property="og:type" content="website" />

<!-- Universal Links / App Links -->
<link rel="apple-app-site-association" href="/.well-known/apple-app-site-association">
<meta name="apple-itunes-app" content="app-id=6741438431">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    text-align: center;
    background-color: #0A1716;
    color: white;
    padding: 20px;
  }
  
  .container {
    max-width: 500px;
  }
  
  h1 {
    font-size: 36px;
    font-weight: 700;
    color: white;
    margin-bottom: 24px;
    line-height: 1.2;
  }
  
  #content p {
    font-size: 18px;
    color: rgba(255, 255, 255, 0.8);
    margin-bottom: 24px;
    line-height: 1.6;
  }
  
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    color: white;
    background-color: #5649ab;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 14px rgba(86, 73, 171, 0.3);
    min-height: 48px;
  }
  
  .btn:hover {
    background-color: #6b5fc7;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(86, 73, 171, 0.4);
  }
  
  .btn:active {
    transform: translateY(0);
  }
  
  .error-message {
    color: #5649ab;
    font-weight: 600;
  }
</style>

</head>
<body>
  <div class="container">
    <h1>You're invited to Retune!</h1>
    <div id="content">
      <p id="message">Opening Retune...</p>
    </div>
  </div>

  <script>
    // Extract invite code from query parameter only
    const searchParams = new URLSearchParams(window.location.search);
    const inviteCode = searchParams.get('code');
    
    const message = document.getElementById("message");
    const content = document.getElementById("content");

    if (!inviteCode) {
      // Redirect to 404 page for invalid invite links
      window.location.href = "/404.html";
    } else {
      // Universal link format: https://retuneapp.com/invite/{code}
      // iOS will handle this via associated domains (applinks:retuneapp.com)
      
      // Deep link for when universal link doesn't trigger
      const deepLink = `retune://invite/${inviteCode}`;
      
      // App store url
      const appStoreURL = "https://testflight.apple.com/join/aM7xzdDP";
      
      // Show download message for all platforms
      // If the app opens (via deep link), user won't see this. If not, they'll see download options.
      message.textContent = "Don't have the app?";
      content.innerHTML = `
        <p style="margin-bottom: 24px;">Download Retune to accept this invitation!</p>
        <a href="${appStoreURL}" class="btn">
          Download on TestFlight
        </a>
      `;
      
      // Detect iOS and try deep link - if app is installed, it will open automatically
      const isIPhone = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isIPhone) {
        // Use a small delay to ensure message is rendered, then attempt deep link
        // If app opens, user won't see the page. If not, they'll see download message.
        requestAnimationFrame(() => {
          window.location = deepLink;
        });
      }
    }
  </script>
</body>
</html>
