<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retune Invite</title>

<meta property="og:title" content="Join me on Retune" />
<meta property="og:description" content="Discover new music and explore what people are listening to around you." />
<meta property="og:image" content="https://raw.githubusercontent.com/ucladevx/retune-website/2025-update/assets/images/retune_icon.png" />
<meta property="og:url" content="https://retuneapp.com/invite" id="og-url" />
<meta property="og:type" content="website" />

<!-- Universal Links / App Links -->
<link rel="apple-app-site-association" href="/.well-known/apple-app-site-association">
<meta name="apple-itunes-app" content="app-id=6741438431">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    text-align: center;
    background-color: #0A1716;
    color: white;
    padding: 20px;
  }
  
  .container {
    max-width: 500px;
  }
  
  h1 {
    font-size: 36px;
    font-weight: 700;
    color: white;
    margin-bottom: 24px;
    line-height: 1.2;
  }
  
  #content p {
    font-size: 18px;
    color: rgba(255, 255, 255, 0.8);
    margin-bottom: 24px;
    line-height: 1.6;
  }
  
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 14px;
    font-size: 16px;
    font-weight: 600;
    color: white;
    background-color: #5649ab;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 14px rgba(86, 73, 171, 0.3);
    height: 52px;
    gap: 10px;
  }
  
  .btn:hover {
    background-color: #6b5fc7;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(86, 73, 171, 0.4);
  }
  
  .btn:active {
    transform: translateY(0);
  }
  
  .error-message {
    color: #5649ab;
    font-weight: 600;
  }
  
  @media (max-width: 767px) {
    html, body {
      overflow: hidden;
      height: 100%;
      touch-action: none;
    }
    .container {
      transform: translateY(-60px);
    }
  }
</style>

</head>
<body>
  <header id="top-bar" style="position: fixed; top: 0; left: 0; width: 100%; height: 88px; z-index: 50; display: flex; align-items: center; padding: 0 24px; background-color: rgba(15, 31, 30, 0); border-bottom: 1px solid transparent; transition: all 0.3s ease;">
      <a href="../index.html">
          <img src="../assets/images/retune_icon.png" alt="Retune" style="width: 48px; height: 48px; border-radius: 12px; transition: transform 0.3s ease; box-shadow: 0 4px 14px rgba(0,0,0,0.3);" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
      </a>
  </header>
  <script>
      window.addEventListener('scroll', function() {
          var topBar = document.getElementById('top-bar');
          if (window.scrollY > 20) {
              topBar.style.backgroundColor = 'rgba(15, 31, 30, 0.95)';
              topBar.style.backdropFilter = 'blur(10px)';
              topBar.style.WebkitBackdropFilter = 'blur(10px)';
              topBar.style.boxShadow = '0 4px 20px rgba(0,0,0,0.5)';
              topBar.style.borderColor = 'rgba(255, 255, 255, 0.05)';
          } else {
              topBar.style.backgroundColor = 'rgba(15, 31, 30, 0)';
              topBar.style.backdropFilter = 'none';
              topBar.style.WebkitBackdropFilter = 'none';
              topBar.style.boxShadow = '0 4px 20px rgba(0,0,0,0)';
              topBar.style.borderColor = 'transparent';
          }
      });
  </script>
  <div class="container">
    <h1>You're invited to Retune!</h1>
    <div id="content">
      <p id="message">Opening Retune...</p>
    </div>
  </div>

  <script>
    // Extract invite code from query parameter only
    const searchParams = new URLSearchParams(window.location.search);
    const inviteCode = searchParams.get('code');
    
    const message = document.getElementById("message");
    const content = document.getElementById("content");

    if (!inviteCode) {
      // Redirect to 404 page for invalid invite links
      window.location.href = "/404.html";
    } else {
      // Universal link format: https://retuneapp.com/invite/{code}
      // iOS will handle this via associated domains (applinks:retuneapp.com)
      
      // App store url
      const appStoreURL = "https://apps.apple.com/us/app/retune-app/id6741438431";
      
      // Show download message for all platforms
      message.textContent = "Don't have the app?";
      content.innerHTML = `
        <p style="margin-bottom: 24px;">Download Retune to accept this invitation!</p>
        <a href="${appStoreURL}" class="btn" style="min-width: 160px;">
          <i class="fab fa-apple" style="font-size: 36px; flex-shrink: 0;"></i>
          <div style="display: flex; flex-direction: column; align-items: flex-start; justify-content: center; line-height: 1;">
            <span style="font-size: 11px; font-weight: 600; opacity: 0.9; margin-bottom: 3px; letter-spacing: 0.01em;">Download on the</span>
            <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.01em;">App Store</span>
          </div>
        </a>
      `;
    }
  </script>
</body>
</html>
